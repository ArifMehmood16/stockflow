spring.application.name=stockflow-inventory
server.address=${STOCKFLOW_API_BIND:127.0.0.1}
server.port=${API_PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=64
server.tomcat.accept-count=16
server.tomcat.connection-timeout=3s
server.max-http-request-header-size=8KB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.datasource.url=${STOCKFLOW_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/postgres}
spring.datasource.username=${STOCKFLOW_JDBC_USER:postgres}
spring.datasource.password=${STOCKFLOW_JDBC_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.read-only=true
spring.datasource.hikari.data-source-properties.readOnlyMode=always
spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.socketTimeout=3
spring.datasource.hikari.data-source-properties.ApplicationName=stockflow-inventory
logging.level.root=WARN
spring.main.banner-mode=off
